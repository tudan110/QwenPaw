{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qwenpaw.fullname" . }}
  labels:
    {{- include "qwenpaw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qwenpaw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.networkPolicy.portalIngress.enabled .Values.networkPolicy.ingress }}
  ingress:
    {{- if .Values.networkPolicy.portalIngress.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: digital-workforce-portal
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- $egress := list }}
  {{- range .Values.networkPolicy.egress }}
  {{- $egress = concat $egress . }}
  {{- end }}
  {{- if or .Values.networkPolicy.dns.enabled $egress }}
  egress:
    {{- if .Values.networkPolicy.dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with $egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
