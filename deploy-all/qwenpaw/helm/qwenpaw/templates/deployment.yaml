apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qwenpaw.fullname" . }}
  labels:
    {{- include "qwenpaw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.rollingUpdate.maxSurge | quote }}
      maxUnavailable: {{ .Values.deploymentStrategy.rollingUpdate.maxUnavailable | quote }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "qwenpaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        cnos.inoe-agent/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "qwenpaw.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if and .Values.persistence.enabled .Values.persistence.rootBootstrap.enabled }}
      initContainers:
        - name: pvc-layout-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              root={{ .Values.persistence.rootBootstrap.mountPath | quote }}
              if [ -f "$root/config.json" ]; then
                echo "PVC root contains a legacy direct working layout; migration is required before subPath deployment." >&2
                exit 1
              fi
              umask 077
              {{- range $name := list "workingDir" "secretDir" "backupsDir" }}
              {{- $directory := index $.Values.persistence $name }}
              {{- if $directory.enabled }}
              directory={{ $directory.subPath | quote }}
              mkdir -p "$root/$directory"
              if [ ! -w "$root/$directory" ] || [ ! -O "$root/$directory" ]; then
                  echo "PVC $directory must be owned and writable by the runtime UID; migrate ownership offline." >&2
                  exit 1
              fi
              chmod {{ if eq $name "secretDir" }}700{{ else }}750{{ end }} "$root/$directory"
              {{- end }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.rootBootstrap.mountPath }}
      {{- else if and .Values.skillSync.enabled .Values.persistence.enabled .Values.persistence.workingDir.enabled }}
      initContainers:
      {{- end }}
      {{- if and .Values.skillSync.enabled .Values.persistence.enabled .Values.persistence.workingDir.enabled }}
        - name: managed-seed-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          command:
            - python3
            - /usr/local/bin/sync_managed_seed.py
            - --apply
            - --yes
            - --seed
            - {{ .Values.skillSync.seedPath | quote }}
            - --target
            - {{ .Values.skillSync.targetPath | quote }}
            {{- if .Values.skillSync.reportPath }}
            - --report
            - {{ .Values.skillSync.reportPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.skillSync.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.workingDir.mountPath }}
              subPath: {{ .Values.persistence.workingDir.subPath }}
            - name: runtime
              mountPath: /app/runtime
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
            - name: tmp
              mountPath: /tmp
          {{- if .Values.persistence.enabled }}
            {{- if .Values.persistence.workingDir.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.workingDir.mountPath }}
              subPath: {{ .Values.persistence.workingDir.subPath }}
            {{- else }}
            - name: ephemeral-working
              mountPath: /app/working
            {{- end }}
            {{- if .Values.persistence.secretDir.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.secretDir.mountPath }}
              subPath: {{ .Values.persistence.secretDir.subPath }}
            {{- else }}
            - name: ephemeral-secret
              mountPath: /app/working.secret
            {{- end }}
            {{- if .Values.persistence.backupsDir.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.backupsDir.mountPath }}
              subPath: {{ .Values.persistence.backupsDir.subPath }}
            {{- else }}
            - name: ephemeral-backups
              mountPath: /app/working.backups
            {{- end }}
          {{- else }}
            - name: ephemeral-working
              mountPath: /app/working
            - name: ephemeral-secret
              mountPath: /app/working.secret
            - name: ephemeral-backups
              mountPath: /app/working.backups
          {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "qwenpaw.fullname" . }}-data
          {{- end }}
        {{- if not .Values.persistence.workingDir.enabled }}
        - name: ephemeral-working
          emptyDir: {}
        {{- end }}
        {{- if not .Values.persistence.secretDir.enabled }}
        - name: ephemeral-secret
          emptyDir: {}
        {{- end }}
        {{- if not .Values.persistence.backupsDir.enabled }}
        - name: ephemeral-backups
          emptyDir: {}
        {{- end }}
      {{- else }}
        - name: ephemeral-working
          emptyDir: {}
        - name: ephemeral-secret
          emptyDir: {}
        - name: ephemeral-backups
          emptyDir: {}
      {{- end }}
      restartPolicy: Always
