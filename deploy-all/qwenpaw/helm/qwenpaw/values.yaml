# 固定服务名（nginx 通过此名称访问）
fullnameOverride: "qwenpaw"

# 镜像
image:
  repository: qwenpaw
  tag: latest
  pullPolicy: IfNotPresent

# 副本数
replicaCount: 1

# RWO PVC 升级时先停止旧 Pod，避免新旧 Pod 重叠挂载。
deploymentStrategy:
  type: Recreate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# Pod 身份和 PVC 组权限；旧卷需先离线迁移所有权，不能通过 root 启动修复。
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

initContainerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# 环境变量
env:
  TZ: "Asia/Shanghai"
  QWENPAW_PORT: "8088"
  # Custom provider configuration is file-backed and not yet synchronized
  # across worker processes; keep one worker until shared-state support lands.
  QWENPAW_APP_WORKERS: "1"
  QWENPAW_APP_BACKLOG: "2048"
  QWENPAW_APP_TIMEOUT_KEEP_ALIVE: "5"
  QWENPAW_DISABLED_CHANNELS: "imessage"
  QWENPAW_SSO_TOKEN_REQUIRED: "true"
  # 仅显式 INOE 用户 ID 可管理/执行高危写操作；普通用户不会自动成为管理员。
  QWENPAW_ADMIN_INOE_USER_IDS: "1"
  QWENPAW_INTERNAL_API_ORIGINS: "http://qwenpaw:8088"
  # QWENPAW_ENABLED_CHANNELS: ""
  # NB: 安全姿态（skill_scanner 模式、domain_guard、delete_ops_disabled、
  # tool_guard auto_denied_rules）放在工作目录的 config.json -> "security" 段，
  # 随 PVC / 镜像内的 working 目录走，换部署方式不会丢。这里不要再固定
  # QWENPAW_*_MODE / QWENPAW_DELETE_OPS_DISABLED —— 它们只是应急覆盖开关。

  # 知识库检索（与 dev start-qwenpaw.sh 保持一致）
  # KNOWLEDGE_BASE_RERANKER: llm（QwenPaw active model）/ heuristic / none
  KNOWLEDGE_BASE_RERANKER: "llm"
  KNOWLEDGE_BASE_HYDE_ENABLED: "true"
  KNOWLEDGE_BASE_TOP_K: "3"
  KNOWLEDGE_BASE_LLM_RERANK_INPUT_K: "15"

  # 智观告警平台接口
  INOE_API_BASE_URL: "http://gateway:8080"
  # 凭据由目标环境的 Secret/设置页注入，不将 token 提交到交付 Chart。
  INOE_API_TIMEOUT: "60"

# 目标环境必须显式创建此 Secret。仅离线基础检索场景可显式 envFrom: []；
# 该选择不授予管理/高危权限，也不会生成 INOE 或模型凭据。
envFrom:
  - secretRef:
      name: qwenpaw-runtime-secrets
      optional: false

# 资源限制
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# 服务端口
service:
  name: qwenpaw
  type: ClusterIP
  port: 8088
  targetPort: 8088
  nodePort: null

# 持久化存储
persistence:
  enabled: true
  # existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # 以 PVC 根目录挂载给 bootstrap initContainer，负责创建并校验
  # working/secret 子目录，避免 subPath 在容器启动前不存在。
  rootBootstrap:
    enabled: true
    mountPath: /app/pvc-root
  # 工作目录挂载
  workingDir:
    enabled: true
    mountPath: /app/working
    subPath: working
  # 密钥目录挂载
  secretDir:
    enabled: true
    mountPath: /app/working.secret
    subPath: secret
  backupsDir:
    enabled: true
    mountPath: /app/working.backups
    subPath: backups

# 在 Helm 升级创建的新 Pod 中同步镜像内受管 Agent/Skill 内容到已有 PVC。
# 同步器只处理 /app/share/qwenpaw-seed 声明的静态文件，不会触碰 secret、
# jobs、知识库 data、sessions、设置数据库或用户自装 Skill。
skillSync:
  enabled: true
  seedPath: /app/share/qwenpaw-seed
  targetPath: /app/working
  reportPath: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# 需要支持 NetworkPolicy 的 CNI；标准策略不支持按 FQDN 放行。
# 不默认放行互联网或整个私网。按目标环境提供明确 selector/CIDR 和端口。
networkPolicy:
  enabled: true
  portalIngress:
    enabled: true
  ingress: []
  dns:
    enabled: true
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # 各组是原生 NetworkPolicy egress rule 列表（to + ports）。
  egress:
    inoe: []
    model: []
    mcp: []
    audit: []
    retrieval: []
    additional: []
